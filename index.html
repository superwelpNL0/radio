<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radio Studio 2030</title>
<meta name="theme-color" content="#07080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#06070c;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--bd:rgba(255,255,255,.11);--tx:#eef1f8;--mu:#8b94aa;--ac:#00e5ff;--ac2:#8b5cf6;--ok:#22e58a;--warn:#ffa41b;--bad:#ff3b57;--bass:0;--r:22px;--f:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--m:'DM Mono',ui-monospace,Menlo,Consolas,monospace}
[data-theme=light]{--bg:#eceff6;--card:rgba(255,255,255,.72);--card2:rgba(255,255,255,.95);--bd:rgba(10,20,50,.12);--tx:#0e1326;--mu:#566078}
html{color-scheme:dark}[data-theme=light]{color-scheme:light}
body{font:14.5px/1.5 var(--f);background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 520px at 12% -10%,color-mix(in srgb,var(--ac) 20%,transparent),transparent),radial-gradient(820px 620px at 100% 8%,color-mix(in srgb,var(--ac2) 22%,transparent),transparent),radial-gradient(700px 500px at 50% 125%,color-mix(in srgb,var(--ac) 12%,transparent),transparent)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}
h3{font-size:.8rem;color:var(--mu);font-weight:600;margin-bottom:12px;letter-spacing:.02em}
a{color:var(--ac)}
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
#nav{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:800;line-height:1.15}
.brand img{width:38px;height:38px;border-radius:12px;object-fit:cover}
.brand .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:20px;color:#031018}
#nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;color:var(--mu);text-decoration:none;font-weight:600;font-size:.9rem}
#nav a:hover{background:var(--card);color:var(--tx)}
#nav a.on{background:var(--card2);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
#nav .sp{flex:1}
main{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 24px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--bd)}
#top .st{font-weight:700;margin-right:auto}
#view{padding:22px 24px 120px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:9px 15px;font-weight:600;cursor:pointer;transition:transform .12s,background .12s,box-shadow .12s;white-space:nowrap}
.btn:hover{background:var(--card2)}.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#031018;border:0;box-shadow:0 8px 28px -10px var(--ac)}
.btn.bad{background:color-mix(in srgb,var(--bad) 24%,transparent);border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.8rem;border-radius:11px}
.btn.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-weight:700;font-size:.78rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu)}
.pill.ok .dot,.dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.pill.bad .dot{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.pill.warn .dot{background:var(--warn)}
body.onair #airbtn{background:color-mix(in srgb,var(--bad) 30%,transparent);border-color:var(--bad)}
body.onair #airbtn .dot{background:var(--bad);box-shadow:0 0 12px var(--bad);animation:bl 1.2s infinite}
.g{display:grid;gap:18px;grid-template-columns:repeat(12,1fr)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;backdrop-filter:blur(22px);box-shadow:0 20px 60px -30px #000}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}
.mu{color:var(--mu)}.mono{font-family:var(--m)}
.np{display:grid;grid-template-columns:minmax(150px,300px) 1fr;gap:26px;align-items:center}
.cover-wrap{position:relative;aspect-ratio:1;width:100%}
.ring{position:absolute;inset:-12px;border-radius:34px;background:conic-gradient(from 0deg,var(--ac),var(--ac2),var(--ac));filter:blur(24px);opacity:calc(.22 + var(--bass)*.7);animation:sp 9s linear infinite}
.cover{position:relative;width:100%;height:100%;border-radius:26px;object-fit:cover;transform:scale(calc(1 + var(--bass)*.04));box-shadow:0 24px 60px -20px #000;background:#111}
.np h2{font-size:clamp(1.5rem,3vw,2.5rem);line-height:1.08;margin:12px 0 4px}
.np .art{font-size:1.15rem;color:var(--ac);font-weight:600}
.time{display:flex;gap:12px;align-items:center;margin:18px 0;font-family:var(--m);font-size:.82rem;color:var(--mu)}
.bar{flex:1;height:10px;border-radius:9px;background:var(--card2);cursor:pointer;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:9px}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ctl .btn{width:52px;height:52px;padding:0;font-size:1.15rem;border-radius:50%}
.ctl .btn.big{width:70px;height:70px;font-size:1.6rem;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#031018;border:0;box-shadow:0 10px 34px -8px var(--ac)}
input[type=range]{accent-color:var(--ac);width:100%;min-width:80px}
input[type=text],input[type=password],input[type=url],input[type=time],input[type=number],input[type=color],select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;width:100%}
textarea{min-height:170px;resize:vertical;line-height:1.55}
input[type=color]{padding:2px;height:40px}
select option{background:#111;color:#eee}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.fld>span{font-size:.78rem;color:var(--mu);font-weight:600}
.fld.ck{flex-direction:row;align-items:center;gap:10px}.fld.ck input{width:auto}
.tbox{text-align:center;padding:8px 0}
.tlabel{font-weight:700;letter-spacing:.14em;font-size:.8rem;color:var(--mu)}
.digits{font:500 clamp(46px,8vw,112px)/1.05 var(--m);text-shadow:0 0 34px color-mix(in srgb,var(--ac) 55%,transparent);transition:color .2s}
.tbox.warn .digits{color:var(--warn);text-shadow:0 0 34px var(--warn)}
.tbox.crit .digits{color:var(--bad);text-shadow:0 0 40px var(--bad);animation:bl .8s steps(2) infinite}
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pad{--c:#fff;position:relative;text-align:left;cursor:pointer;min-height:112px;padding:12px;border-radius:18px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,transparent),var(--card));overflow:hidden;transition:transform .1s}
.pad:active{transform:scale(.95)}
.pad.on{box-shadow:0 0 0 2px var(--c),0 0 30px var(--c);animation:pu .7s infinite alternate}
.pad b{display:block;font-size:.85rem;margin-top:4px}
.pad .ic{font-size:1.5rem}
.pad kbd{position:absolute;right:9px;top:9px;font:500 .68rem var(--m);background:rgba(0,0,0,.35);color:#fff;border-radius:6px;padding:2px 6px}
.pad canvas{width:100%;height:26px;display:block;margin-top:6px}
.pad .ed{position:absolute;right:8px;bottom:8px;font-size:.8rem;opacity:.7;padding:2px 6px;border-radius:8px;background:rgba(0,0,0,.3)}
.drop{border:2px dashed var(--bd);border-radius:18px;padding:16px;text-align:center;color:var(--mu);margin-top:14px}
body.dragging .drop{border-color:var(--ac);color:var(--ac)}
.mix{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ch{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.ch input[type=range]{writing-mode:vertical-lr;direction:rtl;height:120px;width:30px;min-width:0}
.ch b{font-size:.72rem;color:var(--mu)}
.mute.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.vu{height:9px;border-radius:9px;background:var(--card2);overflow:hidden}
.vu i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--warn) 75%,var(--bad));transition:width .06s}
canvas.viz{width:100%;height:190px;display:block;border-radius:16px;background:rgba(0,0,0,.25)}
.qi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--card);margin-bottom:8px;cursor:grab}
.qi.first{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.qi img{width:40px;height:40px;border-radius:9px}
.qi .t{flex:1;min-width:0}.qi .t b,.qi .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi.over{outline:2px dashed var(--ac)}
.tag{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--card2);color:var(--mu)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}
.li.cur{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.li.nx{border-color:var(--ac)}
.li .tm{font:500 .95rem var(--m);min-width:54px}
.big-n{font:500 3rem/1 var(--m)}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wxg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.wxg .card{padding:14px}.wxg .v{font:500 1.7rem var(--m)}
#mini{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:20px;background:color-mix(in srgb,var(--bg) 78%,transparent);border:1px solid var(--bd);backdrop-filter:blur(22px);width:min(400px,calc(100vw - 24px));box-shadow:0 20px 50px -20px #000}
#mini img{width:52px;height:52px;border-radius:12px}
#mini .t{flex:1;min-width:0}#mini .t b,#mini .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .bar{height:5px;margin-top:6px}
#mini .btn{width:38px;height:38px;padding:0;border-radius:50%}
body.hidemini #mini,body.obs #mini{display:none}
#emg{position:fixed;inset:0;z-index:100;display:none;place-items:center;text-align:center;background:rgba(160,0,20,.94);animation:bl 1s steps(2) infinite}
#emg.show{display:grid}#emg h1{font-size:clamp(2rem,7vw,5rem)}
dialog{border:1px solid var(--bd);border-radius:20px;background:var(--bg);color:var(--tx);padding:22px;width:min(420px,92vw);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--card2);backdrop-filter:blur(20px);border:1px solid var(--bd);padding:10px 16px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px -10px #000;animation:tin .25s}
.note{font-size:.8rem;color:var(--mu);margin-top:8px}
.warnbox{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:14px;padding:10px 14px;font-size:.85rem;margin-bottom:12px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:.88rem}
kbd{font:500 .78rem var(--m);background:var(--card2);border:1px solid var(--bd);border-radius:7px;padding:2px 8px}
/* OBS */
body.obs #nav,body.obs #top{display:none}body.obs #app{display:block}body.obs #view{padding:0}
body.obs-t{background:transparent}body.obs-t::before{display:none}
.of{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:4vh 4vw;gap:3vh}
.of .hd{display:flex;align-items:center;gap:2vw;justify-content:space-between}
.of .hd img{height:9vh;border-radius:14px}.of .stn{font-size:3.4vh;font-weight:800}
.of .mid{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center}
.of .cover-wrap{width:52vh}.of h2{font-size:8vh;line-height:1.05}.of .art{font-size:4.4vh}
.of .digits{font-size:15vh}.of .ft{display:flex;justify-content:space-between;align-items:end;font-size:3vh}
.onp{display:inline-flex;gap:18px;align-items:center;padding:16px 22px 16px 16px;border-radius:26px;background:rgba(8,10,18,.72);border:1px solid var(--bd);backdrop-filter:blur(20px);margin:24px;min-width:520px}
.onp img{width:120px;height:120px;border-radius:18px}.onp h2{font-size:30px}.onp .art{font-size:20px;color:var(--ac)}
.ot{display:grid;place-items:center;min-height:100vh}.ot .digits{font-size:22vw}
.ovl{position:fixed;left:2vw;right:2vw;bottom:3vh;display:flex;align-items:center;gap:22px;padding:14px 26px 14px 14px;border-radius:26px;background:rgba(8,10,18,.78);border:1px solid var(--bd);backdrop-filter:blur(20px)}
.ovl img.c{width:88px;height:88px;border-radius:16px}.ovl .lg{height:60px;border-radius:12px}
.ovl .t{flex:1;min-width:0}.ovl h2{font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ovl .art{color:var(--ac);font-size:18px;font-weight:600}
.ovl .ck{font:500 32px var(--m)}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes bl{50%{opacity:.35}}@keyframes pu{to{filter:brightness(1.25)}}@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
@media(max-width:1100px){.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.s3,.s4{grid-column:span 6}}
@media(max-width:900px){#app{display:block}#nav{position:fixed;z-index:40;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px;border-top:1px solid var(--bd);border-right:0;overflow-x:auto;gap:2px}
#nav .brand,#nav .sp{display:none}#nav a{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 10px;white-space:nowrap}#nav a.on{box-shadow:inset 0 3px 0 var(--ac)}
#top{padding:10px 14px}#view{padding:16px 14px 190px}#mini{bottom:72px;right:50%;transform:translateX(50%)}.np{grid-template-columns:1fr;text-align:center}.np .cover-wrap{max-width:280px;margin:0 auto}.ctl{justify-content:center}.mix{gap:4px}}
@media(max-width:600px){.s3,.s4{grid-column:span 12}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <main>
    <header id="top">
      <span class="st" data-f="station"></span>
      <button class="btn" id="airbtn" data-act="air"><i class="dot"></i><span data-f="airtxt">OFF AIR</span></button>
      <span class="mono" data-f="clock" style="font-weight:500"></span>
      <button class="btn sm" data-act="quickmute" data-f="qm" title="Quick mute (Q)">🔊</button>
      <button class="btn sm bad" data-act="emergency" title="Noodknop (E)">🚨</button>
      <button class="btn sm" data-act="theme" title="Donker/licht">🌓</button>
      <button class="btn sm" data-act="fs" title="Volledig scherm">⛶</button>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="mini">
  <img data-cover alt="">
  <div class="t"><b data-f="title"></b><span class="mu" data-f="artist"></span><div class="bar" data-act="seek"><i data-prog></i></div></div>
  <button class="btn" data-act="prev">⏮</button><button class="btn pri" data-act="toggle" data-f="playicon">▶</button><button class="btn" data-act="next">⏭</button>
</div>
<div id="emg"><div><h1>🚨 NOODMELDING</h1><p id="emgt" style="font-size:1.6rem;margin:12px 0 24px">Programma onderbroken</p><button class="btn" data-act="emgoff">Sluiten</button></div></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<audio id="streamEl" preload="none"></audio>

<script>
'use strict';
/* =========================================================
   Radio Studio 2030 — één bestand, geen backend nodig.
   Alles staat in de browser (localStorage + IndexedDB).
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const fmt=ms=>{ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return(h?p2(h)+':':'')+p2(m)+':'+p2(s)};
const fmtH=ms=>{ms=Math.max(0,Math.floor(ms/1000));return p2(Math.floor(ms/3600))+':'+p2(Math.floor(ms%3600/60))+':'+p2(ms%60)};
const LS={get(k,d){try{const v=localStorage.getItem('rs.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('rs.'+k,JSON.stringify(v))}catch(e){toast('Opslag vol of geblokkeerd')}}};
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3800)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const go=r=>{location.hash='#/'+r};
const isObs=()=>route().startsWith('obs');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const kn=k=>k===' '?'Space':k.length===1?k.toUpperCase():k;
function cover(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;const a=h%360,b=(a+70+h%80)%360;
 const s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${a},80%,55%)'/><stop offset='1' stop-color='hsl(${b},80%,22%)'/></linearGradient></defs><rect width='400' height='400' fill='url(#g)'/><circle cx='${100+h%200}' cy='${120+h%160}' r='${60+h%80}' fill='rgba(255,255,255,.14)'/><circle cx='200' cy='200' r='92' fill='none' stroke='rgba(255,255,255,.25)' stroke-width='6'/><circle cx='200' cy='200' r='14' fill='rgba(0,0,0,.35)'/></svg>`;
 return'data:image/svg+xml;utf8,'+encodeURIComponent(s)}

/* ---------- instellingen ---------- */
const DEF={station:'Radio Studio 2030',logo:'',accent:'#00e5ff',theme:'dark',mini:true,show:'Avondshow',host:'Presentator',streamUrl:'',statusUrl:'',
 city:'Leeuwarden',lat:53.2012,lon:5.7999,geoFor:'Leeuwarden',region:'Nederland',trafficUrl:'',newsMode:'rss',newsFeed:'https://feeds.nos.nl/nosnieuwsalgemeen',
 aiUrl:'https://api.openai.com/v1/chat/completions',aiKey:'',aiModel:'gpt-4o-mini',ttsUrl:'',ttsKey:'',voice:'',rate:1,duck:true,crossfade:false,
 spClient:'',spRedirect:'',viz:'spectrum',jingleEvery:0,jingleId:'jingle',sched:'manual',autoSpeak:false,bgMusicId:'',bgAuto:true,bgLoop:true};
let cfg={...DEF,...LS.get('cfg',{})};const saveCfg=()=>LS.set('cfg',cfg);
const HKN={playpause:'Play / Pause',next:'Volgend nummer',prev:'Vorig nummer',mic:'Microfoon aan/uit',soundboard:'Naar soundboard',jingle:'Jingle afspelen',stop:'Stop alle geluiden',quickmute:'Quick mute',emergency:'Noodknop'};
const HKD={playpause:' ',next:'n',prev:'p',mic:'m',soundboard:'s',jingle:'b',stop:'Escape',quickmute:'q',emergency:'e'};
let HK={...HKD,...LS.get('hotkeys',{})};
let M={mic:.8,music:.8,sb:.9,tts:1,master:.9,mute:{},...LS.get('mix',{})};M.mute=M.mute||{};const saveMix=()=>LS.set('mix',M);

/* ---------- audio-engine ---------- */
let ctx,bus={},an,anL,anR,micAn,micStream,micNode,duck=1,fade=1;
function ensureCtx(){if(ctx){if(ctx.state==='suspended')ctx.resume();return ctx}
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 for(const k of['master','music','sb','tts','mic'])bus[k]=ctx.createGain();
 an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.78;
 anL=ctx.createAnalyser();anR=ctx.createAnalyser();anL.fftSize=anR.fftSize=512;
 const sp=ctx.createChannelSplitter(2);
 ['music','sb','tts'].forEach(k=>bus[k].connect(bus.master));
 bus.master.connect(an);bus.master.connect(ctx.destination);bus.master.connect(sp);sp.connect(anL,0);sp.connect(anR,1);
 micAn=ctx.createAnalyser();micAn.fftSize=512;bus.mic.connect(micAn);
 applyMix();return ctx}
function applyMix(){const g=k=>M.mute[k]?0:M[k];
 if(ctx){bus.master.gain.value=M.mute.master?0:M.master;bus.music.gain.value=g('music')*duck*fade;bus.sb.gain.value=g('sb');bus.tts.gain.value=g('tts');bus.mic.gain.value=g('mic')}
 spVol();const a=$('#streamEl');if(a)a.volume=M.mute.master?0:M.master}
function fadeTo(v,ms){return new Promise(r=>{const a=fade,t0=performance.now();(function s(){const k=Math.min(1,(performance.now()-t0)/ms);fade=a+(v-a)*k;applyMix();k<1?requestAnimationFrame(s):r()})()})}
function setDuck(on){duck=on&&cfg.duck?.25:1;applyMix()}
function stopAll(){Object.keys(act).forEach(stopSound);speechSynthesis?.cancel();if(ttsSrc){try{ttsSrc.stop()}catch{}}setDuck(false);toast('Alle geluiden gestopt')}

/* ---------- rustige achtergrond / loop ---------- */
let bgSrc=null,bgGain=null,bgKey='';
let ambientBuf=null;
function makeAmbient(){
 if(ambientBuf)return ambientBuf;
 const c=ensureCtx(),sr=c.sampleRate,dur=16,b=c.createBuffer(2,sr*dur,sr);
 const notes=[110,130.81,146.83,164.81];
 for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<d.length;i++){const t=i/sr, n=notes[Math.floor(t/4)%notes.length];d[i]=(Math.sin(2*Math.PI*n*t)*.035+Math.sin(2*Math.PI*(n/2)*t)*.025+Math.sin(2*Math.PI*.18*t)*.01)*(.7+.3*Math.sin(t*.11));}}
 return ambientBuf=b
}
async function startBgLoop(id=cfg.bgMusicId){
 if(np.playing||!cfg.bgAuto)return;
 if(bgSrc&&bgKey===id)return;
 stopBgLoop();
 ensureCtx();
 try{
  let b;
  if(id){const snd=sounds.find(x=>x.id===id);if(!snd)throw new Error('Achtergrondbestand niet gevonden');b=await getBuf(snd)}
  else b=makeAmbient();
  const src=ctx.createBufferSource(),g=ctx.createGain();src.buffer=b;src.loop=cfg.bgLoop!==false;g.gain.value=.16;src.connect(g).connect(bus.music);src.start();
  bgSrc=src;bgGain=g;bgKey=id||'ambient';
  src.onended=()=>{if(bgSrc===src){bgSrc=null;bgGain=null;bgKey=''}};
 }catch(e){toast('Achtergrondmuziek: '+e.message)}
}
function stopBgLoop(){
 if(!bgSrc)return;
 try{bgGain?.gain.setTargetAtTime(0,ctx.currentTime,.03);bgSrc.stop(ctx.currentTime+.15)}catch{}
 bgSrc=null;bgGain=null;bgKey='';
}
function syncBackground(){if(np.playing)stopBgLoop();else if(ttsSrc||speechSynthesis?.speaking)startBgLoop();}


/* ---------- soundboard (geluiden worden lokaal gesynthetiseerd; eigen bestanden in IndexedDB) ---------- */
function mkBuf(dur,fn){const c=ensureCtx(),sr=c.sampleRate,n=Math.floor(dur*sr),b=c.createBuffer(1,n,sr),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.max(-1,Math.min(1,fn(i/sr,i/n)||0));return b}
const env=(t,a,d)=>Math.min(1,t/a)*Math.exp(-t/d),tone=(f,t)=>Math.sin(2*Math.PI*f*t),saw=(f,t)=>2*((f*t)%1)-1,nz=()=>Math.random()*2-1;
const arp=(notes,step,dec,dur)=>mkBuf(dur,t=>{let s=0;notes.forEach((f,i)=>{const u=t-i*step;if(u>=0)s+=(tone(f,u)*.5+saw(f,u)*.1)*env(u,.01,dec)*.4});return s});
const SYN={
 jingle:()=>arp([523.25,659.25,783.99,1046.5],.16,.5,2),
 applaus:()=>mkBuf(3,(t,k)=>nz()*.45*(.6+.4*Math.sin(t*37)*Math.sin(t*23))*Math.min(1,t/.3)*Math.min(1,(1-k)*4)),
 bell:()=>mkBuf(2.5,t=>(tone(880,t)*.5+tone(1760,t)*.2+tone(2640,t)*.1)*env(t,.002,.6)),
 radioid:()=>mkBuf(1.2,t=>((t<.22)?tone(880,t):(t>.35&&t<.6)?tone(1320,t):0)*.4),
 hit:()=>mkBuf(1.1,t=>[220,277.2,329.6,440].reduce((s,f)=>s+saw(f,t)*.12,0)*env(t,.005,.35)),
 alert:()=>mkBuf(1.8,t=>saw(t%.6<.3?900:650,t)*.28*Math.min(1,(1.8-t)*4)),
 laugh:()=>mkBuf(1.3,t=>saw(240+70*Math.sin(t*38),t)*.3*(Math.sin(t*20)>0?1:.15)*Math.min(1,(1.3-t)*3)),
 intro:()=>arp([392,494,587,659,784,988,1175,1568],.14,.4,2.4),
 stationid:()=>arp([659.25,783.99,987.77,783.99],.2,.7,2),
 effect:()=>mkBuf(1.6,(t,k)=>(nz()*.55+tone(70-40*k,t)*.6)*Math.exp(-t*2.6)),
 newsintro:()=>mkBuf(3,t=>{const n=[392,392,523.25,659.25,784],s=[0,.22,.44,.66,.9];let r=0;n.forEach((f,i)=>{const u=t-s[i];if(u>=0)r+=(saw(f,u)*.14+tone(f*2,u)*.1)*env(u,.01,i==4?1:.3)});return r})
};
const PAL=['#ff9d00','#22e58a','#00e5ff','#8b5cf6','#ffd23f','#ff5a36','#ff3b57','#ff7ad9','#5b8cff','#2de2c5'];
const DEFS=[['jingle','JINGLE','🎺',0],['applaus','APPLAUS','👏',1],['radioid','RADIO ID','📻',2],['newsintro','NEWS INTRO','📰',3],['bell','BELL','🔔',4],['hit','HIT','🔥',5],['alert','ALERT','🚨',6],['laugh','LAUGH','😂',7],['intro','INTRO','🎵',8],['stationid','STATION ID','🎙️',9],['effect','EFFECT','💥',0]]
 .map((a,i)=>({id:a[0],name:a[1],icon:a[2],color:PAL[a[3]],vol:1,key:'F'+(i+1),bank:0,syn:a[0]}));
let sounds=LS.get('sounds',DEFS),banks=LS.get('banks',['Hoofd','Extra']),curBank=0;
const saveSounds=()=>LS.set('sounds',sounds);
const bufCache={},act={};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('radiostudio',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbPut(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('files').objectStore('files').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDel(k){const d=await idb();return new Promise(res=>{const t=d.transaction('files','readwrite');t.objectStore('files').delete(k);t.oncomplete=res})}
async function getBuf(s){if(bufCache[s.id])return bufCache[s.id];let b;
 if(s.syn&&SYN[s.syn])b=SYN[s.syn]();else{const f=await idbGet(s.id);if(!f)throw new Error('Bestand ontbreekt');b=await ensureCtx().decodeAudioData(await f.arrayBuffer())}
 return bufCache[s.id]=b}
async function playSound(id){const s=sounds.find(x=>x.id===id);if(!s)return;ensureCtx();if(act[id]){stopSound(id);return}
 try{const b=await getBuf(s),src=ctx.createBufferSource(),g=ctx.createGain();src.buffer=b;g.gain.value=s.vol??1;src.connect(g).connect(bus.sb);
  src.onended=()=>{delete act[id];paintPads()};act[id]={src,g};src.start();paintPads()}catch(e){toast('Kan "'+s.name+'" niet afspelen: '+e.message)}}
function stopSound(id){const a=act[id];if(!a)return;try{a.g.gain.setTargetAtTime(0,ctx.currentTime,.02);a.src.stop(ctx.currentTime+.1)}catch{}}
const paintPads=()=>$$('.pad[data-id]').forEach(p=>p.classList.toggle('on',!!act[p.dataset.id]));
function drawWave(cv,b){const w=cv.width=cv.clientWidth*2||300,h=cv.height=52,g=cv.getContext('2d'),d=b.getChannelData(0),st=Math.floor(d.length/w);g.fillStyle='rgba(255,255,255,.75)';
 for(let x=0;x<w;x+=3){let m=0;for(let i=0;i<st;i+=Math.max(1,st>>5))m=Math.max(m,Math.abs(d[x*st+i]||0));const bh=Math.max(2,m*h);g.fillRect(x,(h-bh)/2,2,bh)}}

const SP={tok:LS.get('sptok',null),player:null,dev:null,user:null,err:''};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const spRedirect=()=>cfg.spRedirect||(location.origin+location.pathname);
async function spLogin(){if(!cfg.spClient){toast('Vul eerst je Spotify Client ID in bij Instellingen');go('settings');return}
 const v=b64u(crypto.getRandomValues(new Uint8Array(48)));LS.set('spver',v);const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
 location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:cfg.spClient,response_type:'code',redirect_uri:spRedirect(),scope:'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state user-read-currently-playing',code_challenge_method:'S256',code_challenge:ch})}

 const j=await r.json();if(!j.access_token)throw new Error(j.error_description||j.error);SP.tok={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+j.expires_in*1000};LS.set('sptok',SP.tok);toast('Spotify gekoppeld ✔')}catch(e){toast('Spotify login mislukt: '+e.message)}}
async function spToken(){const t=SP.tok;if(!t)return null;if(Date.now()<t.exp-60000)return t.access;

  SP.tok={access:j.access_token,refresh:j.refresh_token||t.refresh,exp:Date.now()+j.expires_in*1000};LS.set('sptok',SP.tok);return SP.tok.access}catch{spLogout(true);return null}}

let T=LS.get('timer',{mode:'countdown',ms:300000,running:false,at:Date.now(),preset:300000,label:'NUMMER EINDIGT OVER'});
function normT(){if(T.running){const d=Date.now()-T.at;T.at=Date.now();if(T.mode==='countdown'||T.mode==='segment'){T.ms=Math.max(0,T.ms-d);if(T.ms===0){T.running=false;saveT();timerDone()}}else T.ms+=d}}
const saveT=()=>LS.set('timer',T);
const showMs=()=>AIR.on?Date.now()-AIR.start:0;
function timerDone(){ensureCtx();playSound('bell');toast('⏱ Timer afgelopen')}
function tToggle(){if(T.mode==='clock')return;if(T.mode==='show')return air();if(!T.running&&(T.mode==='countdown'||T.mode==='segment')&&T.ms<=0)T.ms=T.preset;T.running=!T.running;T.at=Date.now();saveT();paint()}
function tReset(){T.running=false;T.ms=(T.mode==='countdown'||T.mode==='segment')?T.preset:0;T.at=Date.now();saveT();paint()}
function tAdd(ms){normT();T.ms+=ms;if(T.mode==='countdown'||T.mode==='segment')T.preset=Math.max(T.preset,T.ms);T.at=Date.now();saveT();paint()}
function parseHMS(s){const p=String(s).trim().split(':').map(Number);if(p.some(isNaN))return null;let ms=0;for(const x of p)ms=ms*60+x;return ms*1000}
const tLabel=()=>({clock:'KLOK',stopwatch:'STOPWATCH',countdown:'COUNTDOWN',segment:T.label,show:AIR.on?'LIVE':'SHOW TIMER'}[T.mode]);
function tDisp(){normT();return T.mode==='clock'?new Date().toLocaleTimeString('nl-NL'):T.mode==='show'?fmtH(showMs()):T.mode==='segment'?fmt(T.ms):fmtH(T.ms)}
function tClass(){if(!(T.mode==='countdown'||T.mode==='segment'))return'';return T.ms<=10000&&(T.running||T.ms===0)?'crit':T.ms<=30000&&T.running?'warn':''}
function air(){AIR.on=!AIR.on;if(AIR.on)AIR.start=Date.now();LS.set('air',AIR);logEv(AIR.on?'ON AIR — '+cfg.show:'OFF AIR');paint()}

function vObs(r){const nx=`<div data-f="nextTrack"></div>`;
 if(r==='obs/now-playing')return`<div class="onp"><img data-cover alt=""><div style="min-width:0"><span class="pill" data-f="npflag"><i class="dot"></i>NOW PLAYING</span><h2 data-f="title"></h2><p class="art" data-f="artist"></p><div class="bar" style="margin-top:10px"><i data-prog></i></div></div></div>`;

 return`<div class="of"><div class="hd"><div class="row" style="gap:20px">${cfg.logo?`<img src="${cfg.logo}" alt="">`:''}<span class="stn" data-f="station"></span></div><span class="pill" data-f="airpill" style="font-size:2.4vh"><i class="dot"></i><span data-f="airtxt2"></span></span></div>
 <div class="mid"><div class="cover-wrap"><div class="ring"></div><img class="cover" data-cover alt=""></div><div><h2 data-f="title"></h2><p class="art" data-f="artist"></p><div class="time" style="font-size:2.4vh"><span data-f="elapsed"></span><div class="bar"><i data-prog></i></div><span data-f="remaining"></span></div><div class="tbox" data-tbox style="text-align:left"><div class="tlabel" data-f="tlabel"></div><div class="digits" data-f="timer"></div></div></div></div>
 <div class="ft"><span class="mono" data-f="clock" style="font-size:5vh"></span><span class="mu">Volgend: <b style="color:var(--tx)" data-f="nextTrack"></b></span></div></div>`}

/* ---------- router + render ---------- */
const route=()=>location.hash.replace(/^#\/?/,'').split('?')[0]||'studio';
function render(){const r=route(),o=r.startsWith('obs');document.body.classList.toggle('obs',o);document.body.classList.toggle('obs-t',o&&r!=='obs');document.body.dataset.route=r;
 $('#view').innerHTML=o?vObs(r):(V[r]||V.studio)();$$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===(V[r]?r:o?'obs':'studio')));
 document.body.classList.toggle('hidemini',!cfg.mini||['studio','dashboard','spotify'].includes(r));
 if($('#voiceSel'))fillVoices();if($('.pad canvas'))$$('canvas[data-wv]').forEach(async cv=>{const s=sounds.find(x=>x.id===cv.dataset.wv);try{drawWave(cv,await getBuf(s))}catch{}});
 if(r==='news')loadNews();if(r==='weather')loadWx();if(r==='traffic')loadTr();if(micStream&&$('#micdev'))micStart&&0;paint();window.scrollTo(0,0)}
async function loadNews(){const n=await getNews();if($('#nsrc')){$('#nsrc').textContent=n.src;$('#nlist').innerHTML=n.items.map(i=>`<div class="li"><span>${esc(i.t)}</span></div>`).join('')}}
async function loadTr(){const t=await getTraffic();if($('#trl'))$('#trl').innerHTML=`<span class="tag">${t.src}</span>`+t.items.map(i=>`<div class="li"><b class="tm">${esc(i.road)}</b><span>${esc(i.text)}</span></div>`).join('')}
async function loadWx(force){const el=$('#wx');try{const j=await getWx(force),c=j.current,d=j.daily,r=Math.round,w=wc(c.weather_code);if(!$('#wx'))return;
 $('#wx').innerHTML=`<div class="wxg"><div class="card"><div class="mu">Nu</div><div class="v">${w[1]} ${r(c.temperature_2m)}°</div><div>${w[0]}</div></div><div class="card"><div class="mu">Gevoelstemperatuur</div><div class="v">${r(c.apparent_temperature)}°</div></div><div class="card"><div class="mu">Regen</div><div class="v">${c.precipitation} mm</div><div class="mu">kans vandaag ${d.precipitation_probability_max[0]}%</div></div><div class="card"><div class="mu">Wind</div><div class="v">${r(c.wind_speed_10m)} <small>km/u</small></div><div><span style="display:inline-block;transform:rotate(${c.wind_direction_10m+180}deg)">↑</span> uit het ${dirOf(c.wind_direction_10m)}</div></div>
 ${[0,1].map(i=>{const x=wc(d.weather_code[i]);return`<div class="card"><div class="mu">${i?'Morgen':'Vandaag'}</div><div class="v">${x[1]} ${r(d.temperature_2m_min[i])}–${r(d.temperature_2m_max[i])}°</div><div>${x[0]} · ${d.precipitation_probability_max[i]}% regen</div></div>`}).join('')}</div>`}catch(e){if(el)el.innerHTML=`<p class="warnbox">Weer laden mislukt: ${esc(e.message)}. Controleer je internetverbinding of de plaatsnaam in Instellingen.</p>`}}

function fields(){const n=new Date(),ss=showState(),cp=curPos(),nt=Q[1];return{
 station:cfg.station,title:np.title,artist:np.artist,album:np.album,elapsed:fmt(cp),remaining:'-'+fmt(np.dur-cp),playicon:np.playing?'⏸':'▶',npflag:np.playing?'NOW PLAYING':'PAUZE',
 srctag:'Bron: Spotify',clock:n.toLocaleTimeString('nl-NL'),date:n.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
 timer:tDisp(),tlabel:tLabel(),tstartl:T.mode==='show'?(AIR.on?'⏹ Off air':'▶ Go live'):T.running?'⏸ Pauze':'▶ Start',
 nextItem:ss.next?ss.next.t+' '+ss.next.label:'—',nextIn:ss.next?'over '+fmt(ss.inMs):'',nextTrack:np.src==='spotify'?'Volgt via Spotify':nt?nt.artist+' – '+nt.title:'—',
 show:cfg.show,host:cfg.host,airtxt:AIR.on?'ON AIR':'OFF AIR',airtxt2:AIR.on?'ON AIR':'OFF AIR',stream:streamTxt(),streammsg:STR.msg,listeners:STR.listeners??'—',lsrc:STR.lsrc||'',
 health:STR.state==='online'?(STR.stalls>3?'🟠 Instabiel ('+STR.stalls+' haperingen)':'🟢 Goed'):'—',qm:M.mute.master?'🔇':'🔊',
 micstate:micState,micbtn:micStream?'Stop':'Start'}}

 $$('[data-f]').forEach(e=>{const v=F[e.dataset.f];if(v!==undefined&&e.textContent!==String(v))e.textContent=v});

 const pr=np.dur?curPos()/np.dur*100:0;$$('[data-prog]').forEach(e=>e.style.width=pr+'%');
 const tc=tClass();$$('[data-tbox]').forEach(e=>{e.classList.toggle('warn',tc==='warn');e.classList.toggle('crit',tc==='crit')});
 const pc=(sel,cls)=>$$(sel).forEach(e=>e.className=e.className.replace(/\b(ok|bad|warn)\b/g,'').trim()+' '+cls);
 document.body.classList.toggle('onair',AIR.on);$$('[data-f=airpill]').forEach(e=>{e.classList.toggle('bad',AIR.on);e.classList.toggle('ok',false)});
 const sc=STR.state==='online'?'ok':STR.state==='offline'||(STR.state==='idle'&&cfg.streamUrl)?'bad':'warn';['streampill','streampill2','streampill3'].forEach(k=>$$(`[data-f=${k}]`).forEach(e=>{e.classList.remove('ok','bad','warn');e.classList.add(sc)}));
 $$('[data-f=micpill]').forEach(e=>{e.classList.remove('ok','bad');e.classList.add(micStream?'ok':'bad')});
 $$('[data-f=npflag]').forEach(e=>{e.classList.toggle('ok',np.playing)});

/* ---------- visualizer ---------- */
const fb=new Uint8Array(512),tb=new Uint8Array(1024);let sm=0,LV={l:0,r:0},lvS=0;
const lvl=a=>{if(!a)return 0;const d=new Uint8Array(a.fftSize);a.getByteTimeDomainData(d);let s=0;for(let i=0;i<d.length;i++){const v=(d[i]-128)/128;s+=v*v}return Math.min(1,Math.sqrt(s/d.length)*3.2)};
function freq(){if(an){an.getByteFrequencyData(fb);let s=0;for(let i=0;i<48;i++)s+=fb[i];if(s>15)return{d:fb,real:true}}
 if(np.playing&&np.src==='spotify'){const t=performance.now()/1000;for(let i=0;i<512;i++)fb[i]=Math.max(0,(Math.sin(t*3+i*.35)*.5+.5)*255*(1-i/620)*(.55+.45*Math.sin(t*2.1+i*.05))*(Math.sin(t*(60/110)*Math.PI*2)>0?1:.72));return{d:fb,real:false}}
 fb.fill(0);return{d:fb,real:true}}
function vizLoop(){requestAnimationFrame(vizLoop);const{d,real}=freq();let b=0;for(let i=1;i<8;i++)b+=d[i];b=b/7/255;sm=sm*.72+b*.28;document.documentElement.style.setProperty('--bass',sm.toFixed(3));
 LV=real&&an?{l:lvl(anL),r:lvl(anR)}:{l:sm*.9,r:sm*.85};
 const mv=micAn&&micStream?lvl(micAn):0;$$('[data-vu=mic]').forEach(e=>e.style.width=(mv*100)+'%');
 const cv=$$('canvas[data-viz]');if(!cv.length)return;const cs=getComputedStyle(document.documentElement),ac=cs.getPropertyValue('--ac').trim()||'#0ef',ac2=cs.getPropertyValue('--ac2').trim()||'#85f';cv.forEach(c=>draw(c,d,c.dataset.mode||cfg.viz,ac,ac2))}
function draw(c,d,mode,ac,ac2){const dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w)return;if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 const gr=g.createLinearGradient(0,h,0,0);gr.addColorStop(0,ac2);gr.addColorStop(1,ac);g.fillStyle=gr;g.strokeStyle=ac;g.lineWidth=2.5;
 if(mode==='spectrum'){const n=72,bw=w/n;for(let i=0;i<n;i++){const v=d[Math.floor(i*3.2)+1]/255,bh=Math.max(2,v*h*.95);g.beginPath();g.roundRect?g.roundRect(i*bw+1,h-bh,bw-3,bh,3):g.rect(i*bw+1,h-bh,bw-3,bh);g.fill()}}
 else if(mode==='eq'){const n=26,bw=w/n,seg=h/16;for(let i=0;i<n;i++){const v=Math.round(d[Math.floor(i*3.8)+1]/255*16);for(let s=0;s<v;s++){g.fillStyle=s>13?'#ff3b57':s>10?'#ffa41b':ac;g.fillRect(i*bw+2,h-(s+1)*seg+2,bw-4,seg-3)}}}
 else if(mode==='wave'){g.beginPath();const t=performance.now()/1000;let live=false;if(an){an.getByteTimeDomainData(tb);for(let i=0;i<300;i++)if(Math.abs(tb[i]-128)>2){live=true;break}}
  for(let x=0;x<=w;x+=3){const i=Math.floor(x/w*1000);const y=live?tb[i]/255*h:h/2+Math.sin(x*.03+t*4)*h*.35*(np.playing?sm+.05:.02)+Math.sin(x*.08+t*6)*h*.1*sm;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
 else if(mode==='bass'){const r=Math.min(w,h)*(.18+sm*.42);g.beginPath();g.arc(w/2,h/2,r,0,7);g.fill();g.globalAlpha=.4;g.beginPath();g.arc(w/2,h/2,r*1.35,0,7);g.stroke();g.globalAlpha=1}
 else if(mode==='vu'){[['L',LV.l],['R',LV.r]].forEach(([l,v],i)=>{const y=h*.18+i*h*.4,bh=h*.28,n=40,bw=(w-40)/n;g.fillStyle='#8b94aa';g.font='700 14px Sora,sans-serif';g.fillText(l,6,y+bh*.7);for(let k=0;k<n;k++){const on=k/n<v;g.fillStyle=on?(k>n*.85?'#ff3b57':k>n*.68?'#ffa41b':'#22e58a'):'rgba(255,255,255,.08)';g.fillRect(30+k*bw,y,bw-3,bh)}})}}

 gnews:el=>run('Nieuws',()=>newsScript(el.dataset.s||'normal')),gwx:()=>run('Weer',weatherScript),gtr:()=>run('Verkeer',trafficScript),ghour:()=>run('Radio-uur',hourScript),ghourspeak:()=>run('Radio-uur',hourScript,true),
 hsel:el=>{hourSel[el.dataset.k]=hourSel[el.dataset.k]?0:1;el.classList.toggle('on',!!hourSel[el.dataset.k])},

 speak:()=>speak(getScript()),stopspeak:()=>stopSpeak(),copy:()=>navigator.clipboard.writeText(getScript()).then(()=>toast('Gekopieerd')),

 splay:streamPlay,sstop:streamStop,spqrefresh:spQueue,splogin:spLogin,splogout:()=>spLogout(),src:el=>useSource(el.dataset.s),splay1:spPlayLink,spq:spAddQueue,
 hk:el=>{capKey=el.dataset.a;toast('Druk nu op de nieuwe toets…')},hkreset:()=>{HK={...HKD};LS.set('hotkeys',HK);render()},
 cp:el=>navigator.clipboard.writeText(el.dataset.t).then(()=>toast('Gekopieerd')),
 export:()=>{const c={...cfg};delete c.aiKey;delete c.ttsKey;dl(new Blob([JSON.stringify({cfg:c,sounds,banks,SC,HK,M},null,1)],{type:'application/json'}),'radiostudio-instellingen.json')},

let capKey=null;
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;ensureCtx();if(el.dataset.act==='toggle'&&SP.player)SP.player.activateElement?.();A[el.dataset.act]?.(el,e)});

 switch(el.dataset.in){case'cfg':cfg[k]=v;if(k==='city')cfg.geoFor='';saveCfg();if(k==='accent'||k==='theme')applyTheme();if(k==='station'){drawNav();paint()}if(k==='mini')render();break;
 case'mix':M[k]=v;saveMix();applyMix();$$(`[data-in=mix][data-k=${k}]`).forEach(x=>{if(x!==el)x.value=v});break;case'tlabel':T.label=v;saveT();break;case'micdev':micStart(v);break;case'micmon':micMon=v;micMonSet();break}});
document.addEventListener('change',async e=>{const el=e.target.closest('[data-file]');if(!el||!el.files?.length)return;const f=el.files[0];
 if(el.id==='fileIn')addFiles(el.files);
 else if(el.dataset.file==='logo'){const img=new Image();img.onload=()=>{const s=Math.min(1,256/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cfg.logo=c.toDataURL('image/png');saveCfg();drawNav();toast('Logo opgeslagen')};img.src=URL.createObjectURL(f)}
 else if(el.dataset.file==='import'){try{const j=JSON.parse(await f.text());if(j.cfg){cfg={...DEF,...j.cfg,aiKey:cfg.aiKey,ttsKey:cfg.ttsKey};saveCfg()}if(j.sounds){sounds=j.sounds;saveSounds()}if(j.banks){banks=j.banks;LS.set('banks',banks)}if(j.SC){SC=j.SC;saveSC()}if(j.HK){HK=j.HK;LS.set('hotkeys',HK)}if(j.M){M=j.M;saveMix()}toast('Geïmporteerd');applyTheme();drawNav();render()}catch{toast('Ongeldig bestand')}}});

addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(capKey){e.preventDefault();HK[capKey]=k;LS.set('hotkeys',HK);capKey=null;render();return}
 for(const[a,key]of Object.entries(HK))if(key===k){e.preventDefault();document.activeElement?.blur?.();ensureCtx();HKA[a]();return}
 const s=sounds.find(x=>x.key&&x.key.toLowerCase()===k.toLowerCase());if(s){e.preventDefault();ensureCtx();playSound(s.id);return}
 if(/^[1-9]$/.test(k)){const s2=sounds.filter(x=>x.bank===curBank)[+k-1];if(s2){ensureCtx();playSound(s2.id)}}});
addEventListener('keyup',e=>{if(e.key===' '&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))e.preventDefault()});
