<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>OBS Timer — Radio Studio 2030</title>
<link rel="stylesheet" href="css/style.css">
<style>html,body{background:transparent !important;}</style>
</head>
<body class="obs">
<script src="js/storage.js"></script>
<script src="js/timer.js"></script>
<div style="padding:24px; width:fit-content;">
  <div style="background:rgba(10,12,18,0.78); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:20px 34px; text-align:center;">
    <div class="timer-label" id="label" style="color:#666e7e;">VOLGEND ITEM</div>
    <div class="timer-display mono" id="display" style="font-size:64px;">03:00</div>
  </div>
</div>
<script>
function render() {
  const t = TimerEngine.getState();
  const val = t.mode === 'stopwatch' ? t.elapsed : t.remaining;
  const el = document.getElementById('display');
  el.textContent = rsFmtClock(val);
  el.classList.toggle('danger', t.mode !== 'stopwatch' && val <= t.dangerAt);
  el.classList.toggle('warn', t.mode !== 'stopwatch' && val > t.dangerAt && val <= t.warnAt);
  document.getElementById('label').textContent = t.segmentLabel;
}
TimerEngine.on(render); render();
</script>
</body>
</html>
