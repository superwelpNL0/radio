<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Uur — Radio Studio 2030</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/storage.js"></script>
<script src="js/shell.js"></script>
<script>
const content = rsInitPage('ai.html', 'Automatische AI-uurtjes', 'Genereer een compleet radio-item: intro, nieuws, weer, verkeer, afsluiting');
const cfg = RS.get(RS_KEYS.apiConfig, {});
content.innerHTML = `
  <div class="grid" style="grid-template-columns:1fr 1.3fr;">
    <div class="panel">
      <div class="panel-head"><h3>Item genereren</h3></div>
      <button class="btn btn-primary btn-lg" id="genBtn" style="width:100%;">🤖 Genereer uur</button>
      <div class="hint" id="hint" style="margin-top:10px;"></div>
      <div class="divider"></div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div class="queue-item" style="cursor:default;"><span>1️⃣</span><div class="meta"><div class="t">Intro</div></div></div>
        <div class="queue-item" style="cursor:default;"><span>2️⃣</span><div class="meta"><div class="t">Nieuws</div></div></div>
        <div class="queue-item" style="cursor:default;"><span>3️⃣</span><div class="meta"><div class="t">Weer</div></div></div>
        <div class="queue-item" style="cursor:default;"><span>4️⃣</span><div class="meta"><div class="t">Verkeer</div></div></div>
        <div class="queue-item" style="cursor:default;"><span>5️⃣</span><div class="meta"><div class="t">Afsluiting</div></div></div>
      </div>
      <div class="divider"></div>
      <button class="btn" id="ttsBtn" style="width:100%;" disabled>🔊 Voorlezen (TTS)</button>
      <button class="btn" id="saveBtn" style="width:100%; margin-top:8px;" disabled>💾 Opslaan als audiobestand</button>
      <audio id="player" controls style="width:100%; margin-top:12px; display:none;"></audio>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Script</h3></div>
      <div class="script-box" id="scriptOut">Nog geen item gegenereerd.</div>
    </div>
  </div>

  <div class="panel" style="margin-top:20px;">
    <div class="panel-head"><h3>Scheduler</h3></div>
    <div class="field" style="max-width:320px;">
      <label>Automatisch genereren</label>
      <select id="schedSelect">
        <option value="manual">Handmatig</option>
        <option value="30">Elke 30 minuten</option>
        <option value="60">Elke 60 minuten</option>
      </select>
    </div>
    <div class="hint" id="schedHint"></div>
  </div>
`;

let lastScript = '';
const genBtn = document.getElementById('genBtn');
const hint = document.getElementById('hint');
const ttsBtn = document.getElementById('ttsBtn');
const saveBtn = document.getElementById('saveBtn');

async function generateHour() {
  genBtn.disabled = true; hint.textContent = 'Nieuws, weer en verkeer ophalen...';
  try {
    const [news, weather, traffic] = await Promise.all([
      fetch('/api/news?category=algemeen').then(r => r.json()),
      fetch('/api/weather?city=' + encodeURIComponent(cfg.weatherCity || 'Leeuwarden')).then(r => r.json()),
      fetch('/api/traffic?region=' + encodeURIComponent(cfg.trafficRegion || 'Nederland')).then(r => r.json()),
    ]);
    hint.textContent = 'Item samenstellen...';
    const res = await fetch('/api/ai/hour', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ news, weather, traffic })
    });
    const data = await res.json();
    lastScript = data.script || '';
    document.getElementById('scriptOut').textContent = lastScript;
    ttsBtn.disabled = false; saveBtn.disabled = false;
    hint.textContent = data.demo ? 'Demo-data gebruikt voor onderdelen zonder API-sleutel.' : 'Item klaar.';
  } catch (e) {
    hint.textContent = 'Fout: ' + e.message;
  }
  genBtn.disabled = false;
}
genBtn.onclick = generateHour;

ttsBtn.onclick = async () => {
  hint.textContent = 'Audio genereren...';
  try {
    const res = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: lastScript }) });
    const data = await res.json();
    const player = document.getElementById('player');
    if (data.audioUrl) { player.src = data.audioUrl; player.style.display = 'block'; player.play(); hint.textContent = 'Audio klaar.'; }
    else if (data.useBrowserTTS && 'speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(lastScript); u.lang = 'nl-NL'; speechSynthesis.speak(u);
      hint.textContent = 'Voorgelezen via browserstem (demo-modus).';
    }
  } catch (e) { hint.textContent = 'TTS-fout: ' + e.message; }
};

saveBtn.onclick = () => {
  const blob = new Blob([lastScript], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ai-uur-script-' + Date.now() + '.txt';
  a.click();
  rsToast('Script opgeslagen (audio via de audiospeler kun je apart downloaden)');
};

let schedTimer = null;
document.getElementById('schedSelect').onchange = (e) => {
  clearInterval(schedTimer);
  const val = e.target.value;
  const schedHint = document.getElementById('schedHint');
  if (val === 'manual') { schedHint.textContent = 'Handmatige modus — gebruik de knop hierboven.'; return; }
  schedHint.textContent = `Volgende automatische generatie over ${val} minuten.`;
  schedTimer = setInterval(generateHour, Number(val) * 60000);
};
document.getElementById('schedSelect').dispatchEvent(new Event('change'));
</script>
</body>
</html>
