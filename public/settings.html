<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instellingen — Radio Studio 2030</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/storage.js"></script>
<script src="js/shell.js"></script>
<script>
const content = rsInitPage('settings.html', 'Instellingen', 'Zenderbranding, hotkeys, stream en locaties');
const station = rsStation();
const cfg = RS.get(RS_KEYS.apiConfig, {});
const hotkeys = RS.get(RS_KEYS.hotkeys, RS_DEFAULT_HOTKEYS);
const clockItems = RS.get(RS_KEYS.showClock, [
  { time: '20:00', item: 'START SHOW' }, { time: '20:05', item: 'MUZIEK' },
  { time: '20:09', item: 'JINGLE' }, { time: '20:10', item: 'MUZIEK' },
  { time: '20:14', item: 'NIEUWS' }, { time: '20:17', item: 'MUZIEK' },
  { time: '20:21', item: 'WEER' }, { time: '20:23', item: 'MUZIEK' },
]);

content.innerHTML = `
  <div class="grid grid-2">
    <div class="panel">
      <div class="panel-head"><h3>Zender</h3></div>
      <div class="field"><label>Zendernaam</label><input type="text" id="stName" value="${station.name}"></div>
      <div class="field"><label>Logo (emoji)</label><input type="text" id="stLogo" value="${station.logo}" maxlength="2"></div>
      <div class="field"><label>Accentkleur</label><input type="text" id="stAccent" value="${station.accent}"></div>
      <div class="field"><label>Huidige show</label><input type="text" id="stShow" value="${station.show}"></div>
      <div class="field"><label>Presentator</label><input type="text" id="stPresenter" value="${station.presenter}"></div>
      <button class="btn btn-primary" id="saveStation">Opslaan</button>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Stream</h3></div>
      <div class="field"><label>Stream URL (Icecast/Shoutcast)</label><input type="url" id="streamUrl" value="${station.streamUrl || ''}" placeholder="https://stream.jouwradio.nl/live"></div>
      <div class="hint">De browser kan door CORS-restricties de stream niet altijd rechtstreeks controleren. Koppel bij voorkeur een backend/proxy voor een betrouwbare online/offline-status.</div>
      <button class="btn" id="checkStream" style="margin-top:10px;">Status controleren</button>
      <div class="hint" id="streamHint" style="margin-top:8px;"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Locaties</h3></div>
      <div class="field"><label>Plaats voor weerbericht</label><input type="text" id="weatherCity" value="${cfg.weatherCity || 'Leeuwarden'}"></div>
      <div class="field"><label>Regio voor verkeer</label><input type="text" id="trafficRegion" value="${cfg.trafficRegion || 'Nederland'}"></div>
      <button class="btn btn-primary" id="saveLocations">Opslaan</button>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Thema</h3></div>
      <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
        <span class="switch"><input type="checkbox" id="lightToggle"><span class="slider"></span></span>
        <span>Licht thema</span>
      </label>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Hotkeys</h3></div>
      <div class="field"><label>Play/Pause</label><input type="text" id="hkPlay" value="${hotkeys.playPause === ' ' ? 'Space' : hotkeys.playPause}"></div>
      <div class="field"><label>Volgende</label><input type="text" id="hkNext" value="${hotkeys.next}"></div>
      <div class="field"><label>Microfoon</label><input type="text" id="hkMic" value="${hotkeys.mic}"></div>
      <div class="field"><label>Stop geluid</label><input type="text" id="hkStop" value="${hotkeys.stopSound}"></div>
      <div class="hint">1–9 zijn altijd gekoppeld aan de eerste soundboard-pads.</div>
      <button class="btn btn-primary" id="saveHotkeys">Opslaan</button>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Data beheren</h3></div>
      <p class="hint">Alle instellingen, sounds en de show clock worden lokaal opgeslagen in je browser (LocalStorage/IndexedDB).</p>
      <button class="btn btn-danger" id="resetBtn">Alles resetten</button>
    </div>
  </div>

  <div class="panel" style="margin-top:20px;">
    <div class="panel-head"><h3>Show Clock</h3><span class="fill"></span><button class="btn btn-sm" id="addClockItem">+ Item toevoegen</button></div>
    <div id="clockList"></div>
  </div>

  <div class="panel" style="margin-top:20px;">
    <div class="panel-head"><h3>API-configuratie</h3></div>
    <p class="hint">Geheime API-sleutels (Spotify, nieuws, weer, verkeer, AI, TTS) worden nooit in de browser opgeslagen. Configureer ze als environment variables op de server — zie <code>.env.example</code> en de README.</p>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="stat"><div class="v" id="spotifyStat">–</div><div class="l">Spotify API</div></div>
      <div class="stat"><div class="v" id="newsStat">–</div><div class="l">Nieuws API</div></div>
      <div class="stat"><div class="v" id="weatherStat">–</div><div class="l">Weather API</div></div>
      <div class="stat"><div class="v" id="trafficStat">–</div><div class="l">Traffic API</div></div>
      <div class="stat"><div class="v" id="aiStat">–</div><div class="l">AI API</div></div>
      <div class="stat"><div class="v" id="ttsStat">–</div><div class="l">Text-to-Speech API</div></div>
    </div>
  </div>
`;

document.getElementById('saveStation').onclick = () => {
  station.name = document.getElementById('stName').value;
  station.logo = document.getElementById('stLogo').value || '📻';
  station.accent = document.getElementById('stAccent').value || '#e8a54b';
  station.show = document.getElementById('stShow').value;
  station.presenter = document.getElementById('stPresenter').value;
  RS.set(RS_KEYS.station, station);
  rsToast('Zenderinstellingen opgeslagen — herlaad de pagina om overal te zien.');
};

document.getElementById('checkStream').onclick = async () => {
  const url = document.getElementById('streamUrl').value;
  station.streamUrl = url; RS.set(RS_KEYS.station, station);
  const hint = document.getElementById('streamHint');
  hint.textContent = 'Controleren...';
  try {
    const res = await fetch('/api/stream/status?url=' + encodeURIComponent(url));
    const d = await res.json();
    station.streamOnline = !!d.online;
    RS.set(RS_KEYS.station, station);
    hint.textContent = d.online ? '🟢 Stream online' : '🔴 Stream offline of niet bereikbaar';
  } catch (e) { hint.textContent = 'Kon status niet controleren (mogelijk CORS-beperking).'; }
};

document.getElementById('saveLocations').onclick = () => {
  cfg.weatherCity = document.getElementById('weatherCity').value;
  cfg.trafficRegion = document.getElementById('trafficRegion').value;
  RS.set(RS_KEYS.apiConfig, cfg);
  rsToast('Locaties opgeslagen');
};

const lightToggle = document.getElementById('lightToggle');
lightToggle.checked = RS.get(RS_KEYS.theme, 'dark') === 'light';
lightToggle.onchange = () => {
  const next = lightToggle.checked ? 'light' : 'dark';
  RS.set(RS_KEYS.theme, next);
  if (next === 'light') document.body.setAttribute('data-theme', 'light'); else document.body.removeAttribute('data-theme');
};

document.getElementById('saveHotkeys').onclick = () => {
  const hk = RS.get(RS_KEYS.hotkeys, RS_DEFAULT_HOTKEYS);
  const playVal = document.getElementById('hkPlay').value;
  hk.playPause = playVal.toLowerCase() === 'space' ? ' ' : playVal.toUpperCase();
  hk.next = document.getElementById('hkNext').value.toUpperCase();
  hk.mic = document.getElementById('hkMic').value.toUpperCase();
  hk.stopSound = document.getElementById('hkStop').value;
  RS.set(RS_KEYS.hotkeys, hk);
  rsToast('Hotkeys opgeslagen');
};

document.getElementById('resetBtn').onclick = () => {
  if (confirm('Weet je zeker dat je alle lokale instellingen en sounds wilt verwijderen?')) {
    localStorage.clear();
    indexedDB.deleteDatabase('radiostudio2030');
    rsToast('Alles gereset — pagina wordt herladen');
    setTimeout(() => location.reload(), 1200);
  }
};

function renderClockList() {
  const host = document.getElementById('clockList');
  host.innerHTML = clockItems.map((c, i) => `
    <div class="queue-item" style="cursor:default;">
      <input type="time" value="${c.time}" data-i="${i}" class="ck-time" style="width:110px;">
      <input type="text" value="${c.item}" data-i="${i}" class="ck-item" style="flex:1; background:transparent; border:none; color:var(--text-hi); font-weight:600;">
      <button class="btn btn-icon btn-sm ck-del" data-i="${i}">🗑</button>
    </div>`).join('');
  host.querySelectorAll('.ck-time').forEach(el => el.onchange = e => { clockItems[e.target.dataset.i].time = e.target.value; RS.set(RS_KEYS.showClock, clockItems); });
  host.querySelectorAll('.ck-item').forEach(el => el.onchange = e => { clockItems[e.target.dataset.i].item = e.target.value; RS.set(RS_KEYS.showClock, clockItems); });
  host.querySelectorAll('.ck-del').forEach(el => el.onclick = e => { clockItems.splice(Number(e.target.dataset.i), 1); RS.set(RS_KEYS.showClock, clockItems); renderClockList(); });
}
renderClockList();
document.getElementById('addClockItem').onclick = () => { clockItems.push({ time: '00:00', item: 'NIEUW ITEM' }); RS.set(RS_KEYS.showClock, clockItems); renderClockList(); };

fetch('/api/config/status').then(r => r.ok ? r.json() : {}).then(d => {
  const map = { spotify: 'spotifyStat', news: 'newsStat', weather: 'weatherStat', traffic: 'trafficStat', ai: 'aiStat', tts: 'ttsStat' };
  Object.entries(map).forEach(([k, id]) => {
    document.getElementById(id).innerHTML = d[k] ? '<span class="chip chip-green">🟢 Actief</span>' : '<span class="chip chip-amber">🟡 Demo</span>';
  });
}).catch(() => {});
</script>
</body>
</html>
