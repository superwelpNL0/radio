<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio — Radio Studio 2030</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/storage.js"></script>
<script src="js/shell.js"></script>
<script src="js/spotify.js"></script>
<script src="js/timer.js"></script>
<script src="js/audio-engine.js"></script>
<script src="js/soundboard-ui.js"></script>
<script>
const content = rsInitPage('studio.html', 'Studio Console', 'Live regie — alles op één plek');
content.innerHTML = `
  <div class="grid" style="grid-template-columns:1.3fr 1fr; align-items:start;">
    <div class="panel">
      <div class="panel-head">
        <h3>Now Playing</h3>
        <span class="fill"></span>
        <span class="chip chip-green" id="airChip"><span class="dot blink"></span>ON AIR</span>
      </div>
      <div style="display:flex; gap:24px;">
        <div style="width:180px; flex-shrink:0;">
          <div class="cover-wrap"><div class="cover-ring" id="coverRing"></div><img id="cover" src="" alt=""></div>
        </div>
        <div style="flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center;">
          <div style="font-size:12px; color:var(--text-low); text-transform:uppercase; letter-spacing:.08em;" id="albumName">Album</div>
          <h2 style="font-size:26px; margin-top:4px;" id="trackTitle">—</h2>
          <div style="color:var(--text-mid); font-size:15px; margin-top:2px;" id="trackArtist">—</div>
          <div style="margin-top:18px;">
            <div class="progress" id="progress"><i></i></div>
            <div class="progress-labels"><span id="posLabel">0:00</span><span id="durLabel">0:00</span></div>
          </div>
          <div class="transport">
            <button class="btn btn-icon" id="prevBtn" title="Vorige">⏮</button>
            <button class="btn btn-icon btn-primary play" id="playBtn" title="Play/Pause">▶</button>
            <button class="btn btn-icon" id="nextBtn" title="Volgende">⏭</button>
          </div>
        </div>
      </div>
      <div class="divider"></div>
      <div id="vizHost" style="height:70px;"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Segment Timer</h3><span class="fill"></span><a href="timer.html" class="btn btn-sm">Volledig scherm →</a></div>
      <div class="timer-label" id="tLabel">VOLGEND ITEM</div>
      <div class="timer-display mono" id="tDisplay">03:00</div>
      <div class="transport" style="margin-top:14px;">
        <button class="btn btn-icon" id="tReset" title="Reset">↺</button>
        <button class="btn btn-icon btn-primary" id="tToggle" title="Start/Pauze">▶</button>
        <button class="btn btn-sm" id="tAdd30">+30s</button>
      </div>
    </div>
  </div>

  <div class="grid grid-3" style="margin-top:20px;">
    <div class="panel">
      <div class="panel-head"><h3>Mini Mixer</h3></div>
      <div id="mixerHost"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Microfoon</h3></div>
      <div style="display:flex; align-items:center; gap:14px;">
        <button class="btn btn-icon btn-lg" id="micBtn" style="font-size:22px;">🎤</button>
        <div style="flex:1;">
          <div class="vu" id="micVu">${Array.from({length:16}).map(()=>'<i></i>').join('')}</div>
          <div class="hint" id="micStatus">Microfoon uit</div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Snelle sounds</h3><span class="fill"></span><a href="soundboard.html" class="btn btn-sm">Alle sounds →</a></div>
      <div id="quickPads" class="sound-grid" style="grid-template-columns:repeat(5,1fr);"></div>
    </div>
  </div>
`;

/* Now playing wiring */
function renderNow() {
  const s = SpotifyEngine.getState();
  document.getElementById('cover').src = s.track.cover;
  document.getElementById('albumName').textContent = s.track.album || '';
  document.getElementById('trackTitle').textContent = s.track.title;
  document.getElementById('trackArtist').textContent = s.track.artist;
  document.getElementById('posLabel').textContent = rsFormatTime(s.position);
  document.getElementById('durLabel').textContent = rsFormatTime(s.track.duration);
  document.querySelector('#progress > i').style.width = (s.position / s.track.duration * 100) + '%';
  document.getElementById('playBtn').textContent = s.isPlaying ? '⏸' : '▶';
}
SpotifyEngine.on('update', renderNow); SpotifyEngine.on('tick', renderNow);
SpotifyEngine.init(); renderNow();
document.getElementById('playBtn').onclick = () => SpotifyEngine.toggle();
document.getElementById('nextBtn').onclick = () => SpotifyEngine.nextTrack();
document.getElementById('prevBtn').onclick = () => SpotifyEngine.prevTrack();
document.getElementById('progress').onclick = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  SpotifyEngine.seek((e.clientX - r.left) / r.width * SpotifyEngine.getState().track.duration);
};
window.addEventListener('rs:playpause', () => SpotifyEngine.toggle());
window.addEventListener('rs:next', () => SpotifyEngine.nextTrack());

/* simple bar visualizer synced loosely to playback (decorative, audio-reactive when mic on) */
const vizHost = document.getElementById('vizHost');
vizHost.innerHTML = Array.from({length:48}).map(()=>'<i></i>').join('');
vizHost.style.cssText = 'display:flex; align-items:flex-end; gap:3px; height:70px;';
vizHost.querySelectorAll('i').forEach(i => i.style.cssText = 'flex:1;background:linear-gradient(180deg,var(--amber),var(--cyan));border-radius:2px;height:10%;opacity:.8;');
setInterval(() => {
  const s = SpotifyEngine.getState();
  vizHost.querySelectorAll('i').forEach(i => {
    const h = s.isPlaying ? (10 + Math.random()*90) : 6;
    i.style.height = h + '%';
  });
}, 140);

/* Timer wiring */
function renderTimer() {
  const t = TimerEngine.getState();
  const val = t.mode === 'stopwatch' ? t.elapsed : t.remaining;
  const el = document.getElementById('tDisplay');
  el.textContent = rsFmtClock(val);
  el.classList.toggle('danger', t.mode !== 'stopwatch' && val <= t.dangerAt);
  el.classList.toggle('warn', t.mode !== 'stopwatch' && val > t.dangerAt && val <= t.warnAt);
  document.getElementById('tLabel').textContent = t.segmentLabel;
  document.getElementById('tToggle').textContent = t.running ? '⏸' : '▶';
}
TimerEngine.on(renderTimer); renderTimer();
document.getElementById('tToggle').onclick = () => TimerEngine.toggle();
document.getElementById('tReset').onclick = () => TimerEngine.reset();
document.getElementById('tAdd30').onclick = () => TimerEngine.addSeconds(30);

/* Mixer */
const mixerHost = document.getElementById('mixerHost');
[['mic','MIC'],['music','MUSIC'],['soundboard','SOUNDBOARD'],['aiVoice','AI VOICE']].forEach(([bus,label]) => {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:center; gap:12px; margin-bottom:12px;';
  row.innerHTML = `<span style="width:110px; font-size:12px; color:var(--text-mid); font-weight:600;">${label}</span>
    <input type="range" min="0" max="100" value="${Math.round(AudioEngine.getBusVolume(bus)*100)}">`;
  row.querySelector('input').oninput = (e) => AudioEngine.setBusVolume(bus, e.target.value/100);
  mixerHost.appendChild(row);
});

/* Mic */
const micBtn = document.getElementById('micBtn');
const micVuEl = document.getElementById('micVu');
micBtn.onclick = async () => {
  if (AudioEngine.isMicOn()) { AudioEngine.disableMic(); document.getElementById('micStatus').textContent = 'Microfoon uit'; micBtn.style.color=''; }
  else {
    try { await AudioEngine.enableMic(); document.getElementById('micStatus').textContent = 'Microfoon actief'; micBtn.style.color='var(--green)'; }
    catch (e) { rsToast('Microfoontoegang geweigerd of niet beschikbaar'); }
  }
};
window.addEventListener('rs:mic', () => micBtn.click());
setInterval(() => {
  const bars = micVuEl.querySelectorAll('i');
  const lvl = AudioEngine.getMicLevel();
  bars.forEach((b, idx) => {
    const active = idx / bars.length < lvl;
    b.style.height = active ? (30 + Math.random()*70) + '%' : '8%';
    b.style.background = idx > bars.length*0.85 ? 'var(--red)' : idx > bars.length*0.6 ? 'var(--amber)' : 'var(--cyan)';
  });
}, 100);

/* Quick soundboard (first 5 pads) */
const quick = document.getElementById('quickPads');
rsRenderSoundboard(quick, { compact: true });
</script>
</body>
</html>
