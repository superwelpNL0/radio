<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist — Radio Studio 2030</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/storage.js"></script>
<script src="js/shell.js"></script>
<script src="js/spotify.js"></script>
<script>
const content = rsInitPage('playlist.html', 'Playlist / Queue', 'Wachtrij beheren voor de uitzending');
content.innerHTML = `
  <div class="grid grid-3">
    <div class="panel">
      <div class="panel-head"><h3>Nu</h3></div>
      <div id="nowBox"></div>
    </div>
    <div class="panel" style="grid-column: span 2;">
      <div class="panel-head"><h3>Wachtrij</h3><span class="fill"></span><button class="btn btn-sm" id="skipBtn">⏭ Skip huidig nummer</button></div>
      <div id="queueBox"></div>
    </div>
  </div>
  <div class="panel" style="margin-top:20px;">
    <div class="panel-head"><h3>Recent afgespeeld</h3></div>
    <div id="recentBox"><div class="hint">Nog niets afgespeeld deze sessie</div></div>
  </div>
`;

function render() {
  const s = SpotifyEngine.getState();
  document.getElementById('nowBox').innerHTML = `
    <div class="queue-item" style="cursor:default;"><img src="${s.track.cover}"><div class="meta"><div class="t">▶ ${s.track.title}</div><div class="a">${s.track.artist}</div></div></div>`;

  const q = document.getElementById('queueBox');
  q.innerHTML = s.queue.map((t, i) => `
    <div class="queue-item" draggable="true" data-i="${i}">
      <img src="${t.cover}"><div class="meta"><div class="t">${t.title}</div><div class="a">${t.artist}</div></div>
      <button class="btn btn-icon btn-sm rs-remove" data-i="${i}" title="Verwijderen">✕</button>
    </div>`).join('') || '<div class="hint">Wachtrij leeg</div>';

  q.querySelectorAll('.queue-item').forEach(el => {
    el.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', el.dataset.i));
    el.addEventListener('dragover', e => e.preventDefault());
    el.addEventListener('drop', e => {
      e.preventDefault();
      const from = Number(e.dataTransfer.getData('text/plain'));
      const to = Number(el.dataset.i);
      const arr = s.queue;
      const [moved] = arr.splice(from, 1);
      arr.splice(to, 0, moved);
      render();
    });
  });
  q.querySelectorAll('.rs-remove').forEach(b => b.addEventListener('click', () => {
    s.queue.splice(Number(b.dataset.i), 1);
    render();
  }));

  document.getElementById('recentBox').innerHTML = s.recent.length ? s.recent.map(t => `
    <div class="queue-item" style="cursor:default;"><img src="${t.cover}"><div class="meta"><div class="t">${t.title}</div><div class="a">${t.artist}</div></div></div>
  `).join('') : '<div class="hint">Nog niets afgespeeld deze sessie</div>';
}
SpotifyEngine.on('update', render);
SpotifyEngine.init(); render();
document.getElementById('skipBtn').onclick = () => SpotifyEngine.nextTrack();
</script>
</body>
</html>
