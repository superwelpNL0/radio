<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>OBS Now Playing — Radio Studio 2030</title>
<link rel="stylesheet" href="css/style.css">
<style>html,body{background:transparent !important;}</style>
</head>
<body class="obs">
<script src="js/storage.js"></script>
<script src="js/spotify.js"></script>
<div style="padding:18px; display:flex; align-items:center; gap:16px; width:fit-content;">
  <div style="background:rgba(10,12,18,0.78); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:14px 22px; display:flex; align-items:center; gap:16px;">
    <img id="cover" src="" style="width:64px; height:64px; border-radius:10px; object-fit:cover;">
    <div>
      <div style="font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; color:#f2f3f5;" id="title">—</div>
      <div style="font-size:13px; color:#a7adba;" id="artist">—</div>
      <div style="margin-top:6px; width:220px; height:4px; background:rgba(255,255,255,0.12); border-radius:4px; overflow:hidden;">
        <div id="bar" style="height:100%; width:0%; background:linear-gradient(90deg,#e8a54b,#3ecfdc);"></div>
      </div>
    </div>
  </div>
</div>
<script>
function render() {
  const s = SpotifyEngine.getState();
  document.getElementById('cover').src = s.track.cover;
  document.getElementById('title').textContent = s.track.title;
  document.getElementById('artist').textContent = s.track.artist;
  document.getElementById('bar').style.width = (s.position / s.track.duration * 100) + '%';
}
SpotifyEngine.on('update', render); SpotifyEngine.on('tick', render);
SpotifyEngine.init(); render();
</script>
</body>
</html>
