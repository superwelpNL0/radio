<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weer — Radio Studio 2030</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/storage.js"></script>
<script src="js/shell.js"></script>
<script>
const content = rsInitPage('weather.html', 'Weerbericht', 'Actueel weer met automatisch script');
const cfg = RS.get(RS_KEYS.apiConfig, {});
content.innerHTML = `
  <div class="grid" style="grid-template-columns:1fr 1.3fr;">
    <div class="panel">
      <div class="panel-head"><h3>Locatie</h3></div>
      <div class="field">
        <label>Plaatsnaam</label>
        <input type="text" id="cityInput" value="${cfg.weatherCity || 'Leeuwarden'}">
      </div>
      <button class="btn btn-primary btn-lg" id="genBtn" style="width:100%;">🌦️ Genereer weerbericht</button>
      <div class="divider"></div>
      <div id="statGrid" class="grid grid-2" style="gap:14px;"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Script</h3></div>
      <textarea id="script" placeholder="Klik op 'Genereer weerbericht'..."></textarea>
      <div class="hint" id="hint" style="margin-top:8px;"></div>
    </div>
  </div>
`;

document.getElementById('genBtn').onclick = async () => {
  const city = document.getElementById('cityInput').value.trim() || 'Leeuwarden';
  cfg.weatherCity = city; RS.set(RS_KEYS.apiConfig, cfg);
  const hint = document.getElementById('hint');
  hint.textContent = 'Weer ophalen...';
  try {
    const res = await fetch('/api/weather?city=' + encodeURIComponent(city));
    const d = await res.json();
    document.getElementById('statGrid').innerHTML = `
      <div class="stat"><div class="v">${d.temp}°C</div><div class="l">Temperatuur</div></div>
      <div class="stat"><div class="v">${d.feelsLike}°C</div><div class="l">Gevoelstemperatuur</div></div>
      <div class="stat"><div class="v">${d.rainChance}%</div><div class="l">Kans op regen</div></div>
      <div class="stat"><div class="v">${d.windSpeed} km/u</div><div class="l">Wind (${d.windDir})</div></div>
      <div class="stat"><div class="v">${d.todayDesc}</div><div class="l">Vandaag</div></div>
      <div class="stat"><div class="v">${d.tomorrowDesc}</div><div class="l">Morgen</div></div>
    `;
    document.getElementById('script').value = d.script || '';
    hint.textContent = d.demo ? 'Demo-data gebruikt (geen Weather-API geconfigureerd).' : 'Klaar.';
  } catch (e) { hint.textContent = 'Fout: ' + e.message; }
};
document.getElementById('genBtn').click();
</script>
</body>
</html>
